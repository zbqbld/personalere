# 在 Linux runner 上构建 OpenNext Worker，并把产物发布成 Release 资源。
#
# 为什么不在 CI 里直接部署：CI 部署需要 Cloudflare API Token，而原生的
# OAuth 登录态只存在于开发机。这里让 CI 只负责构建，产物由本机已登录的
# wrangler 直接部署，凭据不进入 CI、不需要创建任何 API Token。
#
# 产物目录 .open-next 整体打包（排除临时 .build），解压后与 wrangler.jsonc
# 中的 main / assets.directory 一一对应。

name: Build Worker Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker bundle
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Package bundle
        run: |
          cd .open-next
          # worker.js 会 import .build/ 下的 durable objects 与编译配置，必须一起打包
          zip -qr ../worker-bundle.zip .

      - name: Publish bundle as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_SHA::8}"
          gh release delete "$TAG" --yes >/dev/null 2>&1 || true
          gh release create "$TAG" worker-bundle.zip \
            --title "Worker bundle $TAG" \
            --notes "Auto-built OpenNext worker bundle for local deployment"
