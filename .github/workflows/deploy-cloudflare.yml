# 在 Linux runner 上构建 OpenNext Worker 并直接部署到 Cloudflare Workers。
# 本机 Windows 的 workerd/OpenNext 构建链路不可用，因此构建与发布都放在 CI。
#
# 仓库 Secret：CLOUDFLARE_API_TOKEN
# Account ID 是公开标识符，直接写在 env 中（也兼容可选的 Secret）。
# 可选 Variable：NEXT_PUBLIC_SITE_URL（面向用户的正式地址，默认取国内可直连的 pages.dev 入口）

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker bundle
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ziwei-doushu-8uh.pages.dev' }}

      - name: Verify Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::缺少 CLOUDFLARE_API_TOKEN：请在仓库 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi

      - name: Create / update D1 tables
        run: npx wrangler d1 execute ziwei-doushu --remote --file=db/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '568ca81e3fcc42ac6171288b96ce0868' }}

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '568ca81e3fcc42ac6171288b96ce0868' }}
